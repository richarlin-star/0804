<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VW0804 - Interaction Demo</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f3f8ff;background:#071425}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:radial-gradient(circle at 25% 20%,#17304c,#071425 68%)}
.shell{height:100%;display:flex;flex-direction:column;padding:min(2.2vw,28px);gap:min(1.6vw,20px)}
.top{display:flex;gap:18px;align-items:flex-start;justify-content:space-between}
.top h1{font-size:clamp(16px,2.5vw,34px);margin:0 0 5px;letter-spacing:.02em}.top p{color:#9bb7cf;font-size:clamp(9px,1vw,13px);margin:0}
.tabs{display:flex;align-items:center;flex-wrap:wrap;gap:6px}button{background:#102b43;border:1px solid #335a7a;color:#bbd2e6;padding:8px 12px;border-radius:7px;font:inherit;font-weight:680;font-size:clamp(9px,1vw,13px);cursor:pointer}button.active{background:#ff6a13;color:#112136;border-color:#ff6a13}button:hover{border-color:#ff6a13}
.content{display:grid;grid-template-columns:minmax(0,1.9fr) 42px minmax(0,1fr);gap:12px;min-height:0;flex:1}
.outputs{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:10px;min-height:0}
.output{min-width:0;min-height:0;border:1px solid #39658a;border-radius:12px;background:#10243c;display:flex;flex-direction:column;padding:10px;gap:7px;transition:opacity .3s,border-color .25s;overflow:hidden}
.output.off{opacity:.2}.output.selected{border-color:#ff6a13;box-shadow:inset 0 0 0 1px #ff6a1360}
.output .heading{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.07em;font-weight:800;color:#f7d0b5}.mode-tag{font-size:8px;color:#8db3d3;font-weight:550}
.windows{display:grid;min-height:0;flex:1;gap:4px}
.window{position:relative;border:1px solid #325878;border-radius:4px;min-width:0;min-height:0;overflow:hidden;background:linear-gradient(150deg,#1b4c66,#092239)}
.window::before{content:"";position:absolute;left:-20%;top:10%;width:110%;height:75%;border-radius:50%;background:radial-gradient(ellipse at center,#58cadc55,transparent 65%);transform:rotate(-19deg)}
.window::after{content:"";position:absolute;width:65%;height:35%;bottom:-12%;right:-10%;border:1px solid #9dd8dc66;transform:rotate(-18deg);border-radius:50%}
.window b{position:absolute;left:4px;top:3px;z-index:2;font-size:clamp(7px,.75vw,10px);color:white;background:#071827c9;padding:2px 4px;border-radius:2px}
.window span{position:absolute;left:9px;bottom:7px;right:6px;z-index:2;font-size:clamp(6px,.7vw,9px);color:#d3f1fa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.window.emphasis{outline:2px solid #ff6a13;outline-offset:-2px;box-shadow:inset 0 0 20px #ff6a1340}
.path-zone{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}.arrow{height:2px;width:100%;background:linear-gradient(to left,#ff6a13,#35c9ff);position:relative;filter:drop-shadow(0 0 5px #35c9ff)}.arrow::before{content:"";position:absolute;left:0;top:-5px;border-right:9px solid #35c9ff;border-top:6px solid transparent;border-bottom:6px solid transparent}.path-zone label{position:absolute;top:53%;font-size:9px;color:#7fabd3;white-space:nowrap}
.sources{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,minmax(0,1fr));gap:7px;min-height:0}
.source{background:#112b46;border:1px solid #2b5674;border-radius:8px;display:flex;align-items:center;gap:9px;padding:9px;min-width:0;cursor:pointer;transition:background .2s,border-color .2s}
.source:hover,.source.selected{background:#164c68;border-color:#35c9ff}.source.selected{box-shadow:inset 0 0 0 1px #35c9ff55}
.source strong{font-size:clamp(10px,1vw,13px);color:#8ce1ff;white-space:nowrap}.source .meta{display:flex;flex-direction:column;min-width:0}.source small{font-size:clamp(7px,.68vw,10px);color:#bbd0de;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.source.stream{border-color:#ff6a1399}.source.stream strong{color:#ffa566}
.footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #29435b;padding-top:8px;gap:10px;font-size:clamp(9px,.95vw,12px);color:#91adc5}
.footer strong{color:#ff9f66}.footnote{font-size:10px;color:#7695ad}
.channel{display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(150deg,var(--a),var(--b));border:1px solid #ffffff18;overflow:hidden;position:relative;border-radius:2px;color:#d8edfc}
.channel::before{content:"";position:absolute;inset:30% -20% -20% 30%;background:radial-gradient(ellipse at 10% 0%,#a9eaf851,transparent 65%);transform:rotate(-25deg)}
.channel em{font-size:clamp(7px,.6vw,10px);font-style:normal;font-weight:700;z-index:2;color:#fff}.channel small{z-index:2;font-size:clamp(5px,.43vw,8px);opacity:.95}
@media(max-width:720px){.shell{padding:10px;gap:8px}.content{grid-template-columns:minmax(0,1.8fr) 15px minmax(0,1fr);gap:4px}.output{padding:5px;gap:3px;border-radius:6px}.source{padding:4px;gap:2px;border-radius:5px}.source small{display:none}.tabs button{padding:5px}.outputs{gap:5px}.sources{gap:4px}.window{border-radius:1px}.output .heading{font-size:9px}.footnote{display:none}}
</style></head>
<body><div class="shell">
<header class="top"><div><h1 id="title">8 Inputs · 4 Outputs</h1><p id="subtitle">Select a visualization mode, then click an input source.</p></div><nav class="tabs"><button data-mode="1" class="active">MODE 1</button><button data-mode="2">MODE 2</button><button data-mode="3">MODE 3</button><button data-mode="4">MODE 4</button><button data-mode="stream">H.265 · 16</button></nav></header>
<section class="content"><div id="outputs" class="outputs"></div><div class="path-zone"><div class="arrow"></div><label>← Signal</label></div><div id="sources" class="sources"></div></section>
<footer class="footer"><div><strong id="info">MODE 1</strong> <span id="description">4 outputs · up to 2 windows per output</span></div><span class="footnote">示範用圖像與訊源配置，非實機輸出截圖</span></footer>
</div><script>
const src=['Executive Dashboard','Presentation','Video Conference','Global Operations','Security Camera','System Monitoring','Network Analytics','Ethernet H.265 Stream'];
const channels=['Main Entrance','Lobby','Parking Area','Loading Dock','Corridor A','Corridor B','Elevator Hall','Server Room','Warehouse','Security Gate','Production','Meeting Room','Reception','Rooftop','Emergency Exit','Exterior'];
const palettes=[['#175a7d','#092a43'],['#535378','#142e55'],['#26757a','#102d40'],['#526c87','#193853'],['#9b673a','#3e4554'],['#386f84','#164161'],['#39737d','#1a4358'],['#9e6f36','#513f48']];
let mode='1', selected=3;
function sourceMarkup(i){let active=selected===i;return `<div class="source ${i===7?'stream':''} ${active?'selected':''}" data-in="${i}"><strong>IN${i+1}</strong><div class="meta"><small>${src[i]}</small></div></div>`;}
function tile(i,label){let p=palettes[i%palettes.length];return `<div class="window ${selected===i?'emphasis':''}" style="background:linear-gradient(145deg,${p[0]},${p[1]})"><b>IN${i+1}</b><span>${label||src[i]}</span></div>`;}
function outputCard(id,inputs,cols,rows,kind=''){const disabled=inputs===null;const list=inputs||[];return `<div class="output ${disabled?'off':''} ${list.includes(selected)?'selected':''}"><div class="heading"><span>OUT${id}</span><span class="mode-tag">${disabled?'INACTIVE':kind || (list.length+' WINDOW'+(list.length===1?'':'S'))}</span></div><div class="windows" style="grid-template-columns:repeat(${cols},minmax(0,1fr));grid-template-rows:repeat(${rows},minmax(0,1fr))">${list.map(i=>tile(i)).join('')}</div></div>`;}
function streamCard(id){return `<div class="output selected"><div class="heading"><span>OUT${id}</span><span class="mode-tag">IN8 · 4K H.265 STREAM</span></div><div class="windows" style="grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))">${channels.map((label,i)=>{let p=palettes[(i*3+i%5)%palettes.length];return `<div class="channel" style="--a:${p[0]};--b:${p[1]}"><em>CH${String(i+1).padStart(2,'0')}</em><small>${label}</small></div>`}).join('')}</div></div>`;}
function draw(){let html='';let info='';let label='';let title='';let subtitle='';
 if(mode==='1'){title='Mode 1 — 4 Outputs';subtitle='Cross-screen capability · Up to two windows per output';html=outputCard(1,[0,1],2,1)+outputCard(2,[2,3],2,1)+outputCard(3,[4,5],2,1)+outputCard(4,[6,7],2,1);label='4 Outputs · Cross-Screen';info='最多 2 視窗／輸出';}
 if(mode==='2'){title='Mode 2 — 2 Outputs';subtitle='Flexible multiview · Up to four windows per output';html=outputCard(1,[0,1,2,3],2,2)+outputCard(2,[4,5,6,7],2,2)+outputCard(3,null,1,1)+outputCard(4,null,1,1);label='2 Outputs · Cross-Screen';info='最多 4 視窗／輸出';}
 if(mode==='3'){title='Mode 3 — High-Density';subtitle='OUT1: six windows · Other outputs: matrix / video wall';html=outputCard(1,[0,1,2,3,4,5],3,2)+outputCard(2,[6],1,1,'MATRIX')+outputCard(3,[7],1,1,'VIDEO WALL PART A')+outputCard(4,[7],1,1,'VIDEO WALL PART B');label='4 Outputs · High-Density';info='OUT1 最多 6 視窗';}
 if(mode==='4'){title='Mode 4 — High-Density';subtitle='OUT1: eight windows · OUT2: one matrix display';html=outputCard(1,[0,1,2,3,4,5,6,7],4,2)+outputCard(2,[7],1,1,'MATRIX')+outputCard(3,null,1,1)+outputCard(4,null,1,1);label='2 Outputs · High-Density';info='OUT1 最多 8 視窗';}
 if(mode==='stream'){title='One 4K Stream. 16 Unique Views.';subtitle='IN8 → OUT2 · H.265 4K streaming · 960×540 for each view';html=outputCard(1,[0,1,2,3,4,5,6,7],4,2)+streamCard(2)+outputCard(3,null,1,1)+outputCard(4,null,1,1);label='MODE 4 · H.265 ADVANCED';info='OUT2 = 單一 4K 串流的 16 種內容';}
 document.querySelector('#outputs').innerHTML=html;document.querySelector('#sources').innerHTML=src.map((_,i)=>sourceMarkup(i)).join('');document.querySelector('#title').textContent=title;document.querySelector('#subtitle').textContent=subtitle;document.querySelector('#info').textContent=label;document.querySelector('#description').textContent=info;
 document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
 document.querySelectorAll('[data-in]').forEach(el=>el.addEventListener('click',()=>{selected=Number(el.dataset.in);draw()}));
}
document.querySelectorAll('[data-mode]').forEach(el=>el.addEventListener('click',()=>{mode=el.dataset.mode;selected=mode==='stream'?7:selected;draw()}));draw();
</script></body></html>
